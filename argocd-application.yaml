apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-ui
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Binitmaharjan-hub/devoops-project-helm.git
    targetRevision: main
    path: .

    helm:
      releaseName: student-ui

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
